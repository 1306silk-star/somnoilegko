<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Панель управления · Сомной_легко</title>

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/admin-components.css" />
  </head>

  <body class="admin is-booting">
    <!-- ── Экран загрузки ── -->
    <div class="boot-screen" id="boot-screen">
      <div class="boot-screen__mark" aria-hidden="true">С_л</div>
      <p class="boot-screen__text">Загружаем панель управления…</p>
    </div>

    <!-- ── Экран входа ── -->
    <div class="auth-screen" id="auth-screen" hidden>
      <div class="auth-screen__aside" aria-hidden="true">
        <div class="auth-screen__aside-inner">
          <p class="auth-screen__brand">Сомной<span>_</span>легко</p>
          <p class="auth-screen__slogan">
            Панель управления сайтом,<br />публикациями и брендом.
          </p>
          <svg class="auth-screen__motif" viewBox="0 0 48 24" aria-hidden="true">
            <path
              d="M4 20 Q24 2 44 14"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>

      <div class="auth-screen__main">
        <form class="auth-form" id="auth-form" novalidate>
          <p class="auth-form__eyebrow">Вход в систему</p>
          <h1 class="auth-form__title">Панель управления</h1>
          <p class="auth-form__subtitle">
            Введите логин и пароль администратора.
          </p>

          <div class="field">
            <label class="field__label" for="auth-login">Логин</label>
            <input
              class="field__input"
              type="text"
              id="auth-login"
              name="login"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="auth-password">Пароль</label>
            <div class="field__password">
              <input
                class="field__input"
                type="password"
                id="auth-password"
                name="password"
                autocomplete="current-password"
                required
              />
              <button
                class="field__password-toggle"
                type="button"
                id="auth-password-toggle"
                aria-label="Показать пароль"
              >
                Показать
              </button>
            </div>
          </div>

          <label class="checkbox">
            <input type="checkbox" id="auth-remember" name="remember" checked />
            <span>Запомнить меня на этом устройстве</span>
          </label>

          <p class="auth-form__error" id="auth-error" role="alert" hidden></p>

          <button class="btn btn--primary btn--block" type="submit" id="auth-submit">
            Войти
          </button>

          <p class="auth-form__hint" id="auth-hint"></p>
        </form>
      </div>
    </div>

    <!-- ── Оболочка панели ── -->
    <div class="shell" id="shell" hidden>
      <div class="shell__scrim" id="shell-scrim" hidden></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar__head">
          <a class="sidebar__brand" href="#/dashboard">
            Сомной<span class="sidebar__brand-underscore">_</span>легко
          </a>
          <button
            class="sidebar__close"
            type="button"
            id="sidebar-close"
            aria-label="Закрыть меню"
          >
            ×
          </button>
        </div>

        <nav class="sidebar__nav" id="sidebar-nav" aria-label="Разделы панели"></nav>

        <div class="sidebar__foot">
          <div class="sidebar__user">
            <span class="sidebar__avatar" id="user-avatar" aria-hidden="true">А</span>
            <span class="sidebar__user-meta">
              <span class="sidebar__user-name" id="user-name">admin</span>
              <span class="sidebar__user-mode" id="storage-mode">локальный режим</span>
            </span>
          </div>
          <button class="sidebar__logout" type="button" id="logout-button">
            Выход
          </button>
        </div>
      </aside>

      <div class="shell__main">
        <header class="topbar">
          <button
            class="topbar__burger"
            type="button"
            id="sidebar-open"
            aria-label="Открыть меню"
            aria-expanded="false"
          >
            <span></span><span></span><span></span>
          </button>

          <div class="topbar__titles">
            <p class="topbar__eyebrow" id="view-eyebrow">Панель</p>
            <h1 class="topbar__title" id="view-title">Обзор</h1>
          </div>

          <div class="topbar__actions">
            <span class="save-state" id="save-state" data-state="saved">
              Всё сохранено
            </span>
            <a
              class="btn btn--ghost btn--sm"
              id="preview-link"
              href="../index.html?cms-preview=1"
              target="_blank"
              rel="noopener"
            >
              Предпросмотр
            </a>
            <button class="btn btn--primary btn--sm" type="button" id="publish-button">
              Опубликовать
            </button>
          </div>
        </header>

        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <!-- ── Служебные слои ── -->
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <div class="modal" id="modal" hidden>
      <div class="modal__overlay" data-modal-close></div>
      <div
        class="modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <div class="modal__head">
          <h2 class="modal__title" id="modal-title"></h2>
          <button
            class="modal__close"
            type="button"
            aria-label="Закрыть"
            data-modal-close
          >
            ×
          </button>
        </div>
        <div class="modal__body" id="modal-body"></div>
        <div class="modal__foot" id="modal-foot"></div>
      </div>
    </div>

    <!-- Контент сайта — база для редактирования -->
    <script src="../data/content.js"></script>

    <!-- Ядро панели -->
    <script src="js/core/crypto.js"></script>
    <script src="js/core/schema.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/fields.js"></script>
    <script src="js/core/router.js"></script>

    <!-- Разделы -->
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/content.js"></script>
    <script src="js/views/projects.js"></script>
    <script src="js/views/cases.js"></script>
    <script src="js/views/faq.js"></script>
    <script src="js/views/testimonials.js"></script>
    <script src="js/views/contacts.js"></script>
    <script src="js/views/seo.js"></script>
    <script src="js/views/telegram.js"></script>
    <script src="js/views/brand-os.js"></script>
    <script src="js/views/ai.js"></script>
    <script src="js/views/apps.js"></script>
    <script src="js/views/settings.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
