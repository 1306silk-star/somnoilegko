# Сайт и панель «Сомной_легко» за nginx.
#
# Наружу смотрит nginx, приложение слушает только localhost. Заголовки
# X-Forwarded-* обязательны: по ним сервер панели определяет настоящий адрес
# клиента и то, что соединение защищено (см. trustProxy в config.json).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # certbot добавит сюда перенаправление на HTTPS и сертификаты.
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Загрузка документов Brand OS и длинные тексты постов.
    client_max_body_size 8m;

    access_log /var/log/nginx/somnoilegko.access.log;
    error_log /var/log/nginx/somnoilegko.error.log;
}
